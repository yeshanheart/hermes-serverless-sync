name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: state_db_tool tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Builds a REAL Hermes state.db schema from tests/fixtures/schema.sql and drives
      # snapshot/merge with synthetic data. No third-party dependencies.
      - name: Run test-suite
        run: python -m unittest discover -s tests -v

  powershell-syntax:
    name: PowerShell syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pwsh is preinstalled on the GitHub runners. This is only a parse check: the
      # Windows-specific runtime behaviour (PS 5.1 encoding, path handling) cannot be
      # exercised on a Linux runner — see GRILL.md R1.
      - name: Parse .ps1 files
        shell: pwsh
        run: |
          $bad = $false
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errs)
            if ($errs) {
              $bad = $true
              Write-Host "FAIL $($_.Name)"
              $errs | ForEach-Object { Write-Host "     $($_.Message)" }
            } else {
              Write-Host "OK   $($_.Name)"
            }
          }
          if ($bad) { exit 1 }
